<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            color: #172033;
            background: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgb(23 32 51 / 8%);
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        button {
            padding: 0.6rem 0.9rem;
            color: #fff;
            background: #2857c5;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            margin-top: 1rem;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 0.85rem;
            border-bottom: 1px solid #e5e9f2;
        }

        th {
            color: #46516a;
            background: #f7f8fc;
        }

        #status {
            min-height: 1.25rem;
            color: #59647a;
        }

        #status.error {
            color: #b42318;
        }
    </style>
</head>
<body>
<main>
    <div class="table-header">
        <div>
            <h1>Students</h1>
            <p>Student records loaded from the database.</p>
        </div>
        <button id="refresh" type="button">Refresh</button>
    </div>
    <p id="status" role="status" aria-live="polite">Loading students…</p>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Department</th>
            </tr>
            </thead>
            <tbody id="students"></tbody>
        </table>
    </div>
</main>
<script>
    const tableBody = document.getElementById('students');
    const status = document.getElementById('status');

    function addCell(row, value) {
        const cell = document.createElement('td');
        cell.textContent = value == null ? '' : String(value);
        row.appendChild(cell);
    }

    async function loadStudents() {
        status.classList.remove('error');
        status.textContent = 'Loading students…';
        tableBody.replaceChildren();

        try {
            const response = await fetch('/api/students');
            if (!response.ok) {
                throw new Error('The student request failed.');
            }

            const students = await response.json();
            if (!Array.isArray(students)) {
                throw new Error('The server returned an unexpected response.');
            }

            if (students.length === 0) {
                status.textContent = 'No student records found.';
                return;
            }

            const rows = students.map(student => {
                const row = document.createElement('tr');
                addCell(row, student.id);
                addCell(row, student.name);
                addCell(row, student.email);
                addCell(row, student.department);
                return row;
            });
            tableBody.replaceChildren(...rows);
            status.textContent = `${students.length} student record${students.length === 1 ? '' : 's'} loaded.`;
        } catch (error) {
            status.classList.add('error');
            status.textContent = 'Could not load students. Check that the application and database are running.';
        }
    }

    document.getElementById('refresh').addEventListener('click', loadStudents);
    loadStudents();
</script>
</body>
</html>
